<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa da Tecnologia</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background: #ffffff;
            padding: 20px;
            margin: auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .campo {
            margin-bottom: 15px; 
        }
        label {
            display: inline-block; 
            width: 160px;          
            font-weight: bold;
        }
        input[type="text"] {
            width: 300px;        
            padding: 8px;
            border: 1px solid #cccccc;
            border-radius: 4px;
        }
        button {
            background-color: #0cbf6bb0;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Cadastro de produto</h1>
        <p>Inclua as informações do produto abaixo.</p>

        <form action="processar_cadastro.php" method="POST">
            <div class="campo">
                <label for="nome">Nome do Produto:</label>
                <input type="text" id="nome" name="nome_produto">
            </div>

            <div class="campo">
                <label for="descricao">Descricao do produto:</label>
                <input type="text" id="descricao" name="descricao_produto">
            </div>

            <div class="campo">
                <label for="valor">Valor do produto:</label>
                <input type="text" id="valor" name="valor_produto">
            </div>

            <div class="campo">
                <label for="fornecedor">Fornecedor:</label>
                <input type="text" id="fornecedor" name="fornecedor_produto">
            </div>

            <button type="submit">Cadastrar</button>
        </form>
    </div>

</body>
</html>
